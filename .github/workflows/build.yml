name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ImposterGame.xcodeproj \
            -scheme ImposterGame \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              # Surface compiler errors as annotations on the run's summary page.
              grep -E "error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -40 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ImposterGame.app Payload/
          zip -qry ImposterGame.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ImposterGame-ipa
          path: ImposterGame.ipa
